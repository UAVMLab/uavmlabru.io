<!-- Status Indicators -->
<div class="status-indicators">
    <div class="status-group">
        <span class="status-label"></span>
        <div class="status-dot" id="status-cfg" title="Профиль пользователя" data-name="Иниц. CFG"></div>
        <div class="status-dot" id="status-dshot" title="DSHOT" data-name="Иниц. DSHOT"></div>
        <div class="status-dot" id="status-kiss" title="Телеметрия KISS" data-name="Иниц. телем."></div>
        <div class="status-dot" id="status-hx711" title="Тензодатчик HX711" data-name="Иниц. датчика"></div>
        <div class="status-dot" id="status-ntc" title="Датчик NTC" data-name="Иниц. NTC"></div>
    </div>
    <div class="status-group">
        <span class="status-label"></span>
        <div class="status-dot" id="status-dshot-task" title="Задача DSHOT" data-name="Задача DSHOT"></div>
        <div class="status-dot" id="status-kiss-task" title="Задача KISS" data-name="Задача телем."></div>
        <div class="status-dot" id="status-sensor-task" title="Задача датчиков" data-name="Задача датчиков"></div>
    </div>
    <div class="status-group">
        <span class="status-label"></span>
        <div class="status-dot" id="status-armed" title="Мотор взведён" data-name="Взведён"></div>
        <div class="status-dot" id="status-spinning" title="Мотор вращается" data-name="Вращение"></div>
        <div class="status-dot" id="status-dshot-send" title="Отправка DSHOT" data-name="Отпр. DSHOT"></div>
        <div class="status-dot" id="status-kiss-read" title="Чтение KISS" data-name="Чтение телем."></div>
        <div class="status-dot" id="status-hx711-tare" title="Тарирование HX711" data-name="Тарир. HX711"></div>
        <div class="status-dot" id="status-hx711-read" title="Чтение HX711" data-name="Чтение HX711"></div>
        <div class="status-dot" id="status-ntc-read" title="Чтение NTC" data-name="Чтение NTC"></div>
    </div>
    <div class="status-group">
        <span class="status-label"></span>
        <div class="status-dot" id="status-warn-battery" title="Низкий заряд АКБ" data-name="Низкий заряд"></div>
        <div class="status-dot" id="status-warn-esc" title="Перегрев ESC" data-name="Перегрев ESC"></div>
        <div class="status-dot" id="status-warn-motor" title="Перегрев мотора" data-name="Перегрев мотора"></div>
        <div class="status-dot" id="status-warn-current" title="Превышение тока" data-name="Превыш. тока"></div>
        <div class="status-dot" id="status-warn-rpm" title="Превышение оборотов" data-name="Превыш. оборотов"></div>
        <div class="status-dot" id="status-warn-stall" title="Заторможенный мотор" data-name="Превыш. тяги"></div>
        <div class="status-dot" id="status-warn-cfg" title="Профили заполнены" data-name="Профили полны"></div>
    </div>
</div>
