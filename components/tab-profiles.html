<section class="tab-panel" id="tab-profiles" role="tabpanel">
    <div class="panel-grid">
        <section class="card">
            <h2>Доступные профили</h2>
            <p class="subtext">Профили, сохранённые на устройстве</p>
            <div class="button-row">
                <button id="loadProfilesButton" disabled data-connected-only title="Подключите устройство для загрузки профилей">Загрузить профили</button>
            </div>
            <div id="profileList" class="profile-list">
                <p class="empty">Нет доступных профилей.</p>
            </div>
            <button id="addProfileButton" class="ghost" disabled data-connected-only title="Подключите устройство для добавления профиля">+ Добавить профиль</button>
        </section>

        <section class="card" id="profileDetailsCard" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <h2 id="profileDetailsTitle">Детали профиля</h2>
                <label class="checkbox-label" style="margin: 0;">
                    <input type="checkbox" id="modifyProfileCheckbox">
                    <span>Изменить</span>
                </label>
            </div>
            
            <form id="profileForm">
                <label class="inline-field">
                    <span>Имя профиля</span>
                    <input type="text" id="profileName" required disabled>
                </label>
                
                <label class="inline-field">
                    <span>KV мотора</span>
                    <input type="text" id="motorKV" required disabled>
                </label>
                
                <label class="inline-field">
                    <span>Диаметр пропеллера (дюйм)</span>
                    <input type="number" id="propDiameter" required step="0.1" disabled>
                </label>
                
                <label class="inline-field">
                    <span>Шаг пропеллера (дюйм)</span>
                    <input type="number" id="propPitch" required step="0.1" disabled>
                </label>
                
                <label class="inline-field">
                    <span>Лопасти пропеллера</span>
                    <input type="number" id="propBlades" required min="2" max="6" disabled>
                </label>
                
                <label class="inline-field">
                    <span>Количество ячеек АКБ</span>
                    <select id="batteryCellCount" required disabled>
                        <option value="0">Неизвестно</option>
                        <option value="1">1S LiPo</option>
                        <option value="2">2S LiPo</option>
                        <option value="3">3S LiPo</option>
                        <option value="4">4S LiPo</option>
                        <option value="5">5S LiPo</option>
                        <option value="6">6S LiPo</option>
                        <option value="7">7S LiPo</option>
                        <option value="8">8S LiPo</option>
                        <option value="9">9S LiPo</option>
                        <option value="10">10S LiPo</option>
                        <option value="11">11S LiPo</option>
                        <option value="12">12S LiPo</option>
                        <option value="13">13S LiPo</option>
                        <option value="14">14S LiPo</option>
                        <option value="15">15S LiPo</option>
                        <option value="16">16S LiPo</option>
                    </select>
                </label>
                
                <label class="inline-field">
                    <span>Полюса мотора</span>
                    <input type="number" id="motorPoles" required min="2" step="2" disabled>
                </label>
                
                <label class="checkbox-label inline-field">
                    <span>Реверс мотора</span>
                    <input type="checkbox" id="motorReverse" disabled>
                    <span style="flex: 1; order: 2;"></span>
                </label>
                
                <label class="inline-field">
                    <span>Газ взведения (48–2047)</span>
                    <input type="number" id="armThrottle" required min="48" max="2047" disabled>
                </label>
                
                <label class="inline-field">
                    <span>Макс. обороты</span>
                    <input type="number" id="maxRPM" required min="0" disabled>
                </label>
                
                <label class="inline-field">
                    <span>Макс. температура ESC (°C)</span>
                    <input type="number" id="maxESCTemp" required step="0.1" disabled>
                </label>
                
                <label class="inline-field">
                    <span>Макс. температура мотора (°C)</span>
                    <input type="number" id="maxMotorTemp" required step="0.1" disabled>
                </label>
                
                <label class="inline-field">
                    <span>Макс. ток (А)</span>
                    <input type="number" id="maxCurrent" required step="0.1" disabled>
                </label>
                
                <label class="inline-field">
                    <span>Макс. тяга (кг)</span>
                    <input type="number" id="maxThrust" required step="0.1" disabled>
                </label>

                <div id="profileActions" class="button-row">
                    <button type="button" id="setProfileButton" class="success" disabled data-connected-only>Сделать активным</button>
                    <button type="button" id="removeProfileButton" class="danger" disabled data-connected-only>Удалить</button>
                    <button type="button" id="downloadProfileButton" class="neutral" disabled>Скачать</button>
                </div>

                <div id="profileModifyActions" class="button-row" style="display: none;">
                    <button type="submit" id="saveProfileButton" class="success" disabled data-connected-only>Сохранить</button>
                    <button type="button" id="cancelModifyButton" class="neutral">Отмена</button>
                </div>
            </form>
        </section>
    </div>
</section>
