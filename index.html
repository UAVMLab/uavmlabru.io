<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#0b5cff">
    <title>Лаборатория моторов БПЛА</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.svg">
    
    <link rel="stylesheet" href="style.css">

    <!-- jsPDF for PDF export -->
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
    <!-- Header Component -->
    <div id="header-container"></div>

    <main>
        <!-- Tabbed Interface (always visible) -->
        <div class="tabs" id="tabbedInterface">
            <!-- Tab Navigation Component -->
            <div id="tab-navigation-container"></div>

            <!-- Tab Content Components -->
            <div id="tab-connection-container"></div>
            <div id="tab-profiles-container"></div>
            <div id="tab-control-container"></div>
            <div id="tab-analize-container"></div>
            <div id="tab-results-container"></div>
            <div id="tab-logs-container"></div>
        </div>
    </main>

    <!-- Footer Component -->
    <div id="footer-container"></div>

    <!-- Fixed Status Indicators with Disarm Button -->
    <div id="fixed-status-indicators" class="fixed-status-bar">
        <div class="status-bar-spacer"></div>
        <div class="status-bar-content">
            <div id="fixed-disarm-container" class="disarm-bar-inner" style="display: none;">
                <button id="fixedDisarmButton" class="disarm-emergency">РАЗВЗВЕСТИ</button>
            </div>
        </div>
    </div>

    <!-- Mobile Bottom Navigation Component -->
    <div id="bottom-nav-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
